<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>显示诊断 · 长征·九十载</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111}
  #fr{position:fixed;left:0;top:0;width:100vw;height:100vh;border:0;background:#fff}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;
    background:rgba(8,8,10,.94);color:#eee;z-index:99;
    font:12px/1.6 ui-monospace,Consolas,monospace;
    padding:10px 12px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
    border-top:2px solid #E8C87E}
  #panel.hide{display:none}
  h1{font-size:13px;margin:0 0 8px;color:#E8C87E;
    display:flex;justify-content:space-between;align-items:center}
  h1 button{font:inherit;background:#E8C87E;color:#111;border:0;
    border-radius:6px;padding:4px 10px;font-weight:700}
  .row{display:flex;justify-content:space-between;gap:8px;
    padding:5px 0;border-bottom:1px solid #26262a}
  .k{color:#8ab4f8;white-space:nowrap}
  .v{text-align:right;word-break:break-all}
  .ok{color:#7ee787}.bad{color:#ff7b72;font-weight:700}
  #show{position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));
    z-index:100;font:12px/1 ui-monospace,monospace;font-weight:700;
    background:#E8C87E;color:#111;border:0;border-radius:20px;padding:10px 14px;
    box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #show.hide{display:none}
</style></head>
<body>
<iframe id="fr" src="artwork.html"></iframe>

<button id="show" class="hide">看诊断</button>

<div id="panel">
  <h1><span>显示诊断（把这一屏截图发我）</span><button id="hide">收起</button></h1>
  <div id="out">检测中…</div>
</div>

<script>
(function(){
  var L=[];
  function row(k,v,cls){
    L.push('<div class="row"><span class="k">'+k+'</span><span class="v '+
           (cls||'')+'">'+v+'</span></div>');
  }
  var ua = navigator.userAgent;
  row('UA', ua.length>160 ? ua.slice(0,160)+'…' : ua);
  var m = /MicroMessenger\/([\d.]+)/.exec(ua);
  row('微信内核', m ? ('MicroMessenger '+m[1]) : '（不是微信）');
  row('XWEB', (/XWEB\/(\d+)/.exec(ua)||[,'无'])[1]);
  row('外层视口', window.innerWidth+' × '+window.innerHeight);
  row('screen', screen.width+' × '+screen.height+' @'+window.devicePixelRatio+'x');

  var s = document.createElement('div');
  var probe = {
    'CSS 变量 var()':  'color:var(--zzz,#123456)',
    'vh 单位':         'height:40vh',
    'max() 函数':      'height:max(100px,40vh)',
    'clamp()':         'width:clamp(10px,20px,30px)',
    'env(safe-area)':  'padding-top:env(safe-area-inset-top,7px)',
    'position:sticky': 'position:sticky',
    'object-fit':      'object-fit:contain',
  };
  for (var k in probe){
    s.style.cssText = probe[k];
    row(k, s.style.length ? '支持' : '不支持', s.style.length ? 'ok' : 'bad');
  }
  row('ResizeObserver', ('ResizeObserver' in window) ? '有' : '无',
      ('ResizeObserver' in window) ? 'ok' : 'bad');
  row('IntersectionObserver', ('IntersectionObserver' in window) ? '有' : '无',
      ('IntersectionObserver' in window) ? 'ok' : 'bad');

  var fr = document.getElementById('fr');
  fr.addEventListener('load', function(){
    setTimeout(function(){
      var d, w;
      try { d = fr.contentDocument; w = fr.contentWindow; }
      catch(e){ row('读 iframe', '被拒绝：'+e.message, 'bad'); done(); return; }
      if (!d){ row('读 iframe', '拿不到 document', 'bad'); done(); return; }

      var sticky = d.querySelector('.mapsticky');
      var svg = d.getElementById('mapsvg');
      var nm = d.querySelector('#mapsvg .nd text.nm');
      var code = d.querySelector('.code');
      var title = d.querySelector('.title img');
      var vh = w.innerHeight;

      row('作品视口', w.innerWidth+' × '+vh);
      var sh = sticky ? sticky.getBoundingClientRect().height : 0;
      row('地图高度', sticky ? Math.round(sh)+'px' : '找不到',
          sh > 160 ? 'ok' : 'bad');
      var pct = sh ? Math.round(100*sh/vh) : 0;
      row('地图占视口', pct+'%  (期望 40%)', (pct>=34 && pct<=46) ? 'ok' : 'bad');
      row('地图 viewBox', svg ? svg.getAttribute('viewBox') : '找不到');
      row('data-core', svg ? (svg.getAttribute('data-core')||'无') : '-');
      row('标签字号', nm ? w.getComputedStyle(nm).fontSize : '找不到');
      row('裁切脚本 style#mapfit',
          d.getElementById('mapfit') ? '已注入' : '没注入',
          d.getElementById('mapfit') ? 'ok' : 'bad');
      var sr = svg ? svg.getBoundingClientRect() : null;
      var br = svg ? svg.parentNode.getBoundingClientRect() : null;
      if (sr && br){
        row('画幅占容器宽', Math.round(100*sr.width/br.width)+'%',
            sr.width/br.width > 0.85 ? 'ok' : 'bad');
      }
      row('封面标题图', title ? (title.naturalWidth+'×'+title.naturalHeight) : '找不到',
          title && title.naturalWidth ? 'ok' : 'bad');
      var imgs = d.querySelectorAll('img'), bad=0, tot=imgs.length;
      for (var i=0;i<imgs.length;i++) if (!imgs[i].complete || !imgs[i].naturalWidth) bad++;
      row('图片加载', (tot-bad)+' / '+tot, bad ? 'bad' : 'ok');
      row('二维码容器', code ? Math.round(code.getBoundingClientRect().width)+'px' : '找不到');
      row('JS 是否跑起来',
          d.getElementById('mapfit') ? '是' : '否（关键！）',
          d.getElementById('mapfit') ? 'ok' : 'bad');
      done();
    }, 2600);
  });

  var finished=false;
  function done(){
    if (finished) return;
    finished = true;
    document.getElementById('out').innerHTML = L.join('');
  }
  setTimeout(done, 7000);

  document.getElementById('hide').onclick = function(){
    document.getElementById('panel').classList.add('hide');
    document.getElementById('show').classList.remove('hide');
  };
  document.getElementById('show').onclick = function(){
    document.getElementById('panel').classList.remove('hide');
    document.getElementById('show').classList.add('hide');
  };
})();
</script>
</body></html>
